exceptions: # We prevent any Throwable (from hooks) from bubbling up to Virtual Desktop's process.
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

style:
  LoopWithTooManyJumpStatements: # The release scan and the music poll loop both exit deliberately from several points.
    active: false
  ThrowsCount: # Updates.download validates status, emptiness and length as three separate failures.
    active: false
  MagicNumber: # Buffer sizes, bitmasks and UI defaults read better inline than behind an alias.
    active: false
  ReturnCount: # Guard clauses are used in hooks for easier debugging, despite the lack of style.
    active: false
