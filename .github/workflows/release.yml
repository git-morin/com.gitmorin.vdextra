name: Build & Release

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

# Read by default so the jobs running third-party actions cannot touch releases; only the
# release job, which runs first-party actions only, is granted write.
permissions:
  contents: read

# Serialised per branch: the version job reads the tags its predecessor published, and the dev
# prune deletes every prerelease but its own, so overlapping runs would drop a release or
# delete a newer one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NIM_VERSION: '2.2.12'
  # Declared once: it keys the NDK cache and is what sdkmanager installs. AGP 8.7 picks this
  # version by default, and the runner image does not ship it, so without a cache every build
  # re-downloads android-ndk-r27 from scratch.
  NDK_VERSION: '27.0.12077973'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # nemohooks is vendored under vendor/ while its repo is private, so there is nothing to
      # resolve here - nim.cfg points at the committed copy. See the Makefile header.
      - name: Type-check Nim
        run: nim check --hints:off app/src/main/nim/vdextra.nim

      - name: Check Nim formatting
        run: |
          fail=0
          tmp=$(mktemp -d)
          for f in app/src/main/nim/*.nim app/src/main/nim/hooks/*.nim; do
            cp "$f" "$tmp/$(basename "$f")"
            nimpretty --maxLineLen:100 --out:"$tmp/$(basename "$f")" "$f"
            if ! diff -u "$f" "$tmp/$(basename "$f")"; then
              echo "::error file=$f::not formatted (run 'make fmt')"
              fail=1
            fi
          done
          exit $fail

      # Pinned via pip rather than taken from the runner image: clang-format's output shifts
      # between major versions, so an image upgrade would otherwise fail the gate on untouched
      # code. This is the same version `make lint` installs locally.
      - name: Check C formatting
        run: |
          pip install --quiet 'clang-format==23.1.3'
          clang-format --dry-run -Werror app/src/main/cpp/init.c

      # ktlint and detekt run as standalone jars rather than Gradle plugins, so this job stays
      # free of the Android SDK: AGP cannot even configure without it. Same reason the Makefile
      # pins them by version - the lint gate has to be reproducible and runnable locally.
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Kotlin lint tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools
          key: kotlin-lint-${{ hashFiles('Makefile') }}

      - name: Check Kotlin formatting
        run: make kt-fmt-check

      - name: Static analysis of Kotlin
        run: make kt-check

  version:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
      tag: ${{ steps.v.outputs.tag }}
      channel: ${{ steps.v.outputs.channel }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # The version is derived from tags, never from a value committed in the tree: a job that
      # commits a bump to main would only retrigger itself.
      - name: Compute version
        id: v
        run: |
          set -euo pipefail

          # Tags are VersionCode-VersionName, which the LSPosed module repo requires. The code
          # is monotonic by construction, so the highest stable release is an integer sort on
          # that prefix - no semver ordering quirks. v1.0 predates the scheme, so fall back to
          # it while it is still the only stable tag.
          stable_tag=$(git tag -l '[0-9]*-*' | grep -v -- '-dev\.' | sort -t- -k1,1n | tail -1 || true)
          if [ -n "$stable_tag" ]; then
            base_name="${stable_tag#*-}"
          else
            stable_tag=$(git tag -l 'v*' | grep -v -- '-dev\.' | sort -V | tail -1 || true)
            base_name="${stable_tag#v}"
          fi
          if [ -z "$stable_tag" ]; then
            base="0.0.0"; range=""
          else
            base=$(echo "$base_name" | awk -F. '{printf "%d.%d.%d", $1, $2, ($3=="" ? 0 : $3)}')
            range="$stable_tag..HEAD"
          fi
          major=$(echo "$base" | cut -d. -f1)
          minor=$(echo "$base" | cut -d. -f2)
          patch=$(echo "$base" | cut -d. -f3)

          subjects=$(git log --pretty=%s ${range:+$range})

          # Gitmoji drives the bump, since the subjects carry no conventional-commit type.
          # Anchored at the start of the subject so a commit *describing* a marker cannot trip
          # it. Shortcodes only, matching the convention the history uses.
          if echo "$subjects" | grep -q '^:boom:'; then
            major=$((major + 1)); minor=0; patch=0; bump=major
          elif echo "$subjects" | grep -qE '^(:sparkles:|:globe_with_meridians:)'; then
            minor=$((minor + 1)); patch=0; bump=minor
          else
            patch=$((patch + 1)); bump=patch
          fi
          next="$major.$minor.$patch"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            channel=stable
            name="$next"
            prerelease=false
            # Stable sorts above every dev build of the same version.
            serial=99
          else
            channel=dev
            n=$(git rev-list --count ${range:-HEAD})
            [ "$n" -lt 1 ] && n=1
            name="$next-dev.$n"
            prerelease=true
            serial=$n
            [ "$serial" -gt 98 ] && serial=98
          fi

          code=$((major * 1000000 + minor * 10000 + patch * 100 + serial))

          # Only the paths that end up in the APK count as a change worth a tag, so a docs or
          # Makefile push does not burn a dev version. main always publishes: a stable release
          # is a deliberate act, not a consequence of what happened to change.
          src_paths="app/src app/libs app/build.gradle build.gradle settings.gradle gradle.properties gradle"
          publish=true
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            prev=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
            if [ -n "$prev" ] && git diff --quiet "$prev" HEAD -- $src_paths; then
              publish=false
              echo "no source change since $prev, skipping the release"
            fi
          fi

          {
            echo "name=$name"
            echo "code=$code"
            echo "tag=$code-$name"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### $name ($channel)"
            echo
            git log --pretty='- %s' ${range:+$range}
          } > changelog.md
          cat changelog.md
          echo "bump: $bump, from ${stable_tag:-no previous tag}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: changelog
          path: changelog.md

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK/cmdline-tools preinstalled but not on PATH;
      # android-actions/setup-android@v3 used to add it, but it also tries to install the
      # long-removed legacy 'tools' package and fails, so point PATH at it ourselves.
      - name: Point PATH at the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "$(find /usr/local/lib/android/sdk/cmdline-tools -mindepth 2 -maxdepth 2 -name bin -type d | sort -V | tail -1)" >> "$GITHUB_PATH"

      # The NDK is the only large download here and its contents are fixed by version, so a
      # plain version-keyed cache always hits. sdkmanager sees the restored package.xml and
      # treats it as already installed.
      - name: Cache the Android NDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" \
            "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1"

      # Caches the dependency graph, the wrapper distribution and the Gradle build cache.
      # cache-read-only defaults to "only write from the default branch", which would leave
      # every dev build reading an empty cache - and dev is where this workflow mostly runs.
      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: false

      # Part of the native code is Nim, which CMake runs as a code generator: it emits C that the
      # NDK's clang compiles. Pinned so a Nim release cannot change codegen under us.
      - name: Set up Nim
        uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -PvdVersionName='${{ needs.version.outputs.name }}' \
            -PvdVersionCode='${{ needs.version.outputs.code }}'

      - name: Show built APK identity
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt 2>/dev/null | head -1)
          if [ -n "$AAPT" ]; then "$AAPT" dump badging "$APK" | grep -m1 '^package:'; fi

      - name: Rename APK to carry its version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/vdextra-${{ needs.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vdextra-${{ needs.version.outputs.name }}
          path: dist/*.apk

  release:
    needs: [ version, build ]
    # Only a real push to main or dev publishes. A manual dispatch just leaves an artifact,
    # which is what the local build-and-install loop wants. The owner check keeps a fork, or
    # anyone who reaches a branch here, from publishing under this repo's name.
    if: >-
      github.event_name == 'push'
      && needs.version.outputs.publish == 'true'
      && github.repository == 'git-morin/com.gitmorin.vdextra'
      && github.actor == 'git-morin'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vdextra-${{ needs.version.outputs.name }}
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: changelog

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          NAME: ${{ needs.version.outputs.name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already published, nothing to do"
            exit 0
          fi
          flags=(--title "$NAME" --notes-file changelog.md --target "$GITHUB_SHA")
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" dist/*.apk

      # The dev channel is a moving target, so keep only the newest prerelease and let its tag
      # go with it; otherwise every push to dev leaves a release behind forever.
      - name: Prune superseded dev prereleases
        if: needs.version.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            -q '.[] | select(.isPrerelease) | .tagName' \
          | grep -- '-dev\.' | grep -vx "$TAG" \
          | while read -r old; do
              echo "deleting superseded $old"
              gh release delete "$old" --yes --cleanup-tag
            done
