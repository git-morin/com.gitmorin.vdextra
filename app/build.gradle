plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signing = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) { signingFile.withInputStream { signing.load(it) } }
def signingValue = { String key -> System.getenv(key) ?: signing.getProperty(key) }
def keystorePath = signingValue('KEYSTORE_FILE')
def vdVersionName = project.findProperty('vdVersionName') ?: '0.0.0-local'
def vdVersionCode = (project.findProperty('vdVersionCode') ?: '1').toString().toInteger()

android {
    namespace 'com.gitmorin.vdextra'
    compileSdk 34

    defaultConfig {
        applicationId "com.gitmorin.vdextra"
        minSdk 29
        targetSdk 34
        versionCode vdVersionCode
        versionName vdVersionName
        ndk { abiFilters "arm64-v8a" }
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword signingValue('KEYSTORE_PASSWORD')
                keyAlias signingValue('KEY_ALIAS')
                keyPassword signingValue('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            ndk { debugSymbolLevel 'none' }
            if (keystorePath) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt') }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs { useLegacyPackaging = false }
        resources { excludes += ['META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'] }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    compileOnly files('libs/libxposed-api.jar')
    implementation files('libs/libxposed-service-full.jar')
}
