# Read automatically by any nim invocation on sources in this directory, so the build and a
# bare `nim check` cannot drift apart.

--os:android
--cpu:arm64
--cc:clang
--app:lib
--noMain:on
-d:release

# Mono drives implicit null checks, GC write barriers and thread suspension through SIGSEGV, so
# Nim must not install its own handlers: hijacking them turned the first signal Mono would have
# handled itself into a Nim fatal error and a silent quit().
-d:noSignalHandler

# Nim's own allocator keeps per-thread heaps and initialises them when it creates a thread.
# Every thread here belongs to Mono or Android, so that state never exists and the first
# allocation on one null-dereferenced its thread-local heap. libc's allocator needs no
# per-thread setup, and atomicArc makes the refcounts safe now that objects cross those threads.
-d:useMalloc
--mm:atomicArc
--threads:on
