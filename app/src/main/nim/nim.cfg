--os:android
--cpu:arm64
--cc:clang
--app:lib
--noMain:on
-d:release
-d:noSignalHandler
-d:useMalloc
--mm:atomicArc
--threads:on

# The logcat tag nemohooks writes under; `make logs` and the Kotlin side both expect this one.
-d:nemohooksLogTag=VDExtra

# Dogfood loop: nemohooks lives in a sibling checkout, so build against its sources directly
# and a library edit lands here with no reinstall. A path that is not there is ignored, which
# is the CI case - it builds the vendored copy below.
--path:"../../../../../nemo-hooks/src"

# TEMPORARY, while the nemohooks repo is private and CI cannot resolve the `requires` URL: a
# committed copy of the library, kept in step by `make vendor` and gated by `make vendor-check`.
# Second in the list, so a sibling checkout always wins locally.
--path:"../../../../vendor/nemohooks/src"
