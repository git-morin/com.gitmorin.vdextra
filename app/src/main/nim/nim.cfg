--os:android
--cpu:arm64
--cc:clang
--app:lib
--noMain:on
-d:release
-d:noSignalHandler
-d:useMalloc
--mm:atomicArc
--threads:on

# The logcat tag nemohooks writes under; `make logs` and the Kotlin side both expect this one.
-d:nemohooksLogTag=VDExtra

# Dogfood loop: nemohooks lives in a sibling checkout, so build against its sources directly
# and a library edit lands here with no reinstall. Both compilers read this file, and a path
# that is not there is ignored - which is the CI case, where `nimble install --depsOnly`
# resolves the `requires` URL into the nimble path instead.
--path:"../../../../../nemo-hooks/src"
